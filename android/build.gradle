// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    // Repositorios públicos primero (más confiables) - Gradle intentará estos primero
    google()
    mavenCentral()
    maven { url 'https://repo1.maven.org/maven2' }
    // Repositorio de plugins de Gradle (puede tener el plugin de jfrog)
    maven {
      url 'https://plugins.gradle.org/m2/'
    }
    // Repositorio público de JFrog como alternativa
    maven {
      url 'https://releases.jfrog.io/artifactory/jfrog-jars'
    }
    // Repositorio interno de EAS Build al final (solo si los públicos fallan)
    maven {
      url 'http://maven.production.caches.eas-build.internal/artifactory/libs-release'
      allowInsecureProtocol = true
    }
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // Agregar el plugin de jfrog explícitamente con versión más antigua disponible en Maven Central
    // Esto puede satisfacer la dependencia de expo-root-project
    classpath('org.jfrog.buildinfo:build-info-extractor-gradle:4.18.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // Repositorio alternativo en caso de problemas con EAS Build
    maven { url 'https://repo1.maven.org/maven2' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

